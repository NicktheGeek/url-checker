<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>URL Checker</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e6;
    --text: #1b1c1e;
    --muted: #6b6f76;
    --flagged: #c0392b;
    --flagged-bg: #fdecea;
    --clean: #1e8e5a;
    --clean-bg: #e9f7ef;
    --unknown: #b8860b;
    --unknown-bg: #fdf6e3;
    --skipped: #9aa0a6;
    --skipped-bg: #f1f2f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.95rem; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  button {
    padding: 0.7rem 1.2rem;
    border: none;
    border-radius: 8px;
    background: #2f6feb;
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { background: #a9c1ec; cursor: default; }
  .verdict {
    padding: 1rem 1.2rem;
    border-radius: 10px;
    margin-bottom: 1.2rem;
    font-weight: 600;
    display: none;
  }
  .verdict.show { display: block; }
  .verdict.SUSPICIOUS { background: var(--flagged-bg); color: var(--flagged); }
  .verdict.NO-ISSUES-FOUND { background: var(--clean-bg); color: var(--clean); }
  .verdict.NO-DATA { background: var(--skipped-bg); color: var(--skipped); }
  .verdict small { display: block; font-weight: 400; margin-top: 0.2rem; color: inherit; opacity: 0.85; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    margin-bottom: 0.6rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
  }
  .card .left { flex: 1; }
  .card .service { font-weight: 600; font-size: 0.9rem; }
  .card .summary { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
  .card a { font-size: 0.8rem; color: #2f6feb; }
  .pill {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill.flagged { background: var(--flagged-bg); color: var(--flagged); }
  .pill.clean { background: var(--clean-bg); color: var(--clean); }
  .pill.unknown, .pill.error { background: var(--unknown-bg); color: var(--unknown); }
  .pill.skipped { background: var(--skipped-bg); color: var(--skipped); }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 1rem; }
  .loading { color: var(--muted); font-size: 0.9rem; display: none; }
  .loading.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>URL Checker</h1>
  <p class="sub">Checks a URL against multiple threat-intel sources at once. Sources without an API key in <code>.env</code> show as "skipped", not an error.</p>

  <form id="checkForm">
    <input type="text" id="urlInput" placeholder="https://example.com/suspicious-link" autocomplete="off" required>
    <button type="submit" id="submitBtn">Check</button>
  </form>

  <div class="loading" id="loading">Checking against all configured sources...</div>
  <div class="verdict" id="verdict"></div>
  <div id="results"></div>
  <div class="meta" id="meta"></div>
</div>

<script>
const form = document.getElementById('checkForm');
const urlInput = document.getElementById('urlInput');
const submitBtn = document.getElementById('submitBtn');
const loading = document.getElementById('loading');
const verdictEl = document.getElementById('verdict');
const resultsEl = document.getElementById('results');
const metaEl = document.getElementById('meta');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = urlInput.value.trim();
  if (!url) return;

  submitBtn.disabled = true;
  loading.classList.add('show');
  verdictEl.classList.remove('show');
  resultsEl.innerHTML = '';
  metaEl.textContent = '';

  try {
    const resp = await fetch('/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      verdictEl.textContent = data.error || 'Something went wrong';
      verdictEl.className = 'verdict show SUSPICIOUS';
      return;
    }
    render(data);
  } catch (err) {
    verdictEl.textContent = 'Could not reach the local server: ' + err;
    verdictEl.className = 'verdict show SUSPICIOUS';
  } finally {
    submitBtn.disabled = false;
    loading.classList.remove('show');
  }
});

function render(data) {
  const verdictClass = data.verdict.replace(/\s+/g, '-');
  verdictEl.textContent = data.verdict;
  verdictEl.className = 'verdict show ' + verdictClass;
  const small = document.createElement('small');
  small.textContent = data.verdict_summary;
  verdictEl.appendChild(small);

  resultsEl.innerHTML = '';
  for (const r of data.results) {
    const card = document.createElement('div');
    card.className = 'card';

    const left = document.createElement('div');
    left.className = 'left';
    const service = document.createElement('div');
    service.className = 'service';
    service.textContent = r.service;
    const summary = document.createElement('div');
    summary.className = 'summary';
    summary.textContent = r.summary;
    left.appendChild(service);
    left.appendChild(summary);
    if (r.link) {
      const a = document.createElement('a');
      a.href = r.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'View full report ->';
      left.appendChild(document.createElement('br'));
      left.appendChild(a);
    }

    const pill = document.createElement('span');
    pill.className = 'pill ' + r.status;
    pill.textContent = r.status;

    card.appendChild(left);
    card.appendChild(pill);
    resultsEl.appendChild(card);
  }

  metaEl.textContent = `${data.sources_checked} source(s) checked, ${data.sources_skipped} skipped (no key), ${data.elapsed_seconds}s`;
}
</script>
</body>
</html>
